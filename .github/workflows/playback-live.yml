name: Browser public Piped probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playback-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-browser-public-piped:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify browser public Piped playback and 4x
        run: npx playwright test --config=e2e/playwright-live.config.mjs
