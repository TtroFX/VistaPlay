name: Cloudflare Relay Check

on:
  push:
    branches: [main]
    paths:
      - 'relay-cloudflare/**'
      - '.github/workflows/relay-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay-cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
